services:
  - type: web
    name: jswindshields-claim-filler
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_KEY
        sync: false   # you will paste the value in Render dashboard
